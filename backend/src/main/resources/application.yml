spring:
  application:
    name: campus-platform
  profiles:
    default: local
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB
server:
  address: 127.0.0.1
  port: 7080
  servlet:
    session:
      timeout: 30m
      cookie:
        name: CAMPUS_SESSION
        http-only: true
        same-site: lax
  error:
    include-message: never
    include-stacktrace: never
app:
  repair:
    reminders:
      enabled: ${REPAIR_REMINDERS_ENABLED:true}
      hours: ${REPAIR_REMINDER_HOURS:48}
      interval-ms: ${REPAIR_REMINDER_INTERVAL_MS:600000}
      initial-delay-ms: ${REPAIR_REMINDER_INITIAL_DELAY_MS:60000}
  demo:
    enabled: false
  agent:
    deepseek:
      enabled: ${DEEPSEEK_ENABLED:false}
      api-key: ${DEEPSEEK_API_KEY:}
      model: ${DEEPSEEK_MODEL:deepseek-flash}
