spring:
  application:
    name: campus-platform
  profiles:
    default: local
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB
server:
  address: 127.0.0.1
  port: 7080
  servlet:
    session:
      timeout: 30m
      cookie:
        name: CAMPUS_SESSION
        http-only: true
        same-site: lax
  error:
    include-message: never
    include-stacktrace: never
app:
  payment:
    enabled: ${PAYMENT_ENABLED:false}
    # ijpay：进程内 IJPay 电脑网站支付；remote：独立 pay-service 扫码支付
    channel: ${PAYMENT_CHANNEL:ijpay}
    remote-url: ${PAYMENT_REMOTE_URL:}
    remote-token: ${PAYMENT_REMOTE_TOKEN:}
    app-id: ${PAYMENT_APP_ID:}
    seller-id: ${PAYMENT_SELLER_ID:}
    private-key: ${PAYMENT_PRIVATE_KEY:}
    alipay-public-key: ${PAYMENT_ALIPAY_PUBLIC_KEY:}
    notify-url: ${PAYMENT_NOTIFY_URL:}
    return-url: ${PAYMENT_RETURN_URL:}
  repair:
    reminders:
      enabled: ${REPAIR_REMINDERS_ENABLED:true}
      hours: ${REPAIR_REMINDER_HOURS:48}
      interval-ms: ${REPAIR_REMINDER_INTERVAL_MS:600000}
      initial-delay-ms: ${REPAIR_REMINDER_INITIAL_DELAY_MS:60000}
  demo:
    enabled: false
  agent:
    deepseek:
      enabled: ${DEEPSEEK_ENABLED:false}
      api-key: ${DEEPSEEK_API_KEY:}
      model: ${DEEPSEEK_MODEL:deepseek-flash}
  cos:
    enabled: ${COS_ENABLED:true}
    secret-id: ${COS_SECRET_ID:}
    secret-key: ${COS_SECRET_KEY:}
    region: ${COS_REGION:ap-guangzhou}
    bucket: ${COS_BUCKET:shiyan-bbs-01-1429420924}
    appid: ${COS_APPID:1429420924}
    avatar-prefix: ${COS_AVATAR_PREFIX:avatars/}

logging:
  charset:
    console: UTF-8
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr([%15.15t]){faint} %clr(%-38.38logger{37}){cyan} %clr(:){faint} %m%n"
  level:
    root: INFO
    cn.zzuit.campus: INFO
    org.springframework.web: WARN
    org.springframework.security: WARN
    com.qcloud.cos: WARN
    org.apache.http: WARN

