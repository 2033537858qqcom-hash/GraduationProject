# /etc/nginx/conf.d/pay-service.conf —— 仅暴露支付相关路径，其余一律 404
server {
    listen 80 default_server;
    server_name _;
    client_max_body_size 64k;
    server_tokens off;

    location = /api/alipay/notify {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    # 内部接口由 HMAC 签名保护；如主后端 IP 固定，建议再加 allow <IP>; deny all;
    location /internal/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location / { return 404; }
}
