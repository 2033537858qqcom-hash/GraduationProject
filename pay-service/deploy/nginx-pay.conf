# IP 直连 HTTP：保持原样，避免未切换 notify 前中断
server {
    listen 80 default_server;
    server_name _;
    client_max_body_size 64k;
    server_tokens off;

    location = /api/alipay/notify {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /internal/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location / { return 404; }
}

# 域名 HTTP -> HTTPS
server {
    listen 80;
    server_name pay.xn--ckst2fk89agjv.cn pay.研途学堂.cn;
    client_max_body_size 64k;
    server_tokens off;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://pay.xn--ckst2fk89agjv.cn$request_uri; }
}

# 域名 HTTPS：仅暴露支付相关路径
server {
    listen 443 ssl;
    server_name pay.xn--ckst2fk89agjv.cn pay.研途学堂.cn;
    client_max_body_size 64k;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/pay.xn--ckst2fk89agjv.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pay.xn--ckst2fk89agjv.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location = /api/alipay/notify {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
    location /internal/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
    location / { return 404; }
}
